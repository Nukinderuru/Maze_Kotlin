<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maze Web</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="status-bar" id="status-bar">Load a maze file or generate a new maze.</div>
    <div class="hint-bar" id="hint-bar">Choose a pick mode and click inside the maze canvas to fill coordinates.</div>
    <div class="content-row">
      <div class="sidebar">
        <section class="panel">
          <h2>File</h2>
          <input type="file" id="maze-file" accept=".txt">
          <button id="upload-maze">Upload Maze</button>
        </section>

        <section class="panel">
          <h2>Generate Maze</h2>
          <div class="field-row">
            <label for="generate-rows">Rows</label>
            <input type="number" id="generate-rows" min="1" max="50" value="10">
          </div>
          <div class="field-row">
            <label for="generate-cols">Cols</label>
            <input type="number" id="generate-cols" min="1" max="50" value="10">
          </div>
          <button id="generate-maze">Generate Maze</button>
        </section>

        <section class="panel">
          <h2>Solve Maze</h2>
          <div class="field-row">
            <label for="start-row">Start Row</label>
            <input type="number" id="start-row" min="1">
          </div>
          <div class="field-row">
            <label for="start-col">Start Col</label>
            <input type="number" id="start-col" min="1">
          </div>
          <div class="field-row">
            <label for="end-row">End Row</label>
            <input type="number" id="end-row" min="1">
          </div>
          <div class="field-row">
            <label for="end-col">End Col</label>
            <input type="number" id="end-col" min="1">
          </div>
          <div class="pick-mode-row">
            <span>Click Mode</span>
            <button id="pick-start">Pick Start</button>
            <button id="pick-end">Pick End</button>
            <button id="pick-clear">Clear</button>
          </div>
          <button id="solve-maze">Solve Maze</button>
        </section>
      </div>

      <div class="canvas-panel">
        <canvas id="maze-canvas" width="500" height="500"></canvas>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
